<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <rect width="600" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="30" y="38" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Global Renewable Energy Share by Source (2015–2025)</text>
  <line x1="60" y1="290" x2="550" y2="290" stroke="#475569" stroke-width="2"/>
  <line x1="60" y1="70" x2="60" y2="290" stroke="#475569" stroke-width="2"/>
  <!-- Y axis labels -->
  <text x="25" y="294" fill="#64748b" font-family="sans-serif" font-size="12">0%</text>
  <text x="20" y="240" fill="#64748b" font-family="sans-serif" font-size="12">25%</text>
  <text x="20" y="185" fill="#64748b" font-family="sans-serif" font-size="12">50%</text>
  <text x="20" y="130" fill="#64748b" font-family="sans-serif" font-size="12">75%</text>
  <text x="15" y="78" fill="#64748b" font-family="sans-serif" font-size="12">100%</text>
  <!-- Bars -->
  <rect x="100" y="150" width="55" height="140" fill="#0284c7" rx="3"/>
  <text x="108" y="315" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Solar PV</text>
  <text x="115" y="142" fill="#0284c7" font-family="sans-serif" font-size="12" font-weight="bold">64%</text>

  <rect x="210" y="175" width="55" height="115" fill="#0d9488" rx="3"/>
  <text x="222" y="315" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Wind</text>
  <text x="225" y="167" fill="#0d9488" font-family="sans-serif" font-size="12" font-weight="bold">52%</text>

  <rect x="320" y="205" width="55" height="85" fill="#6366f1" rx="3"/>
  <text x="330" y="315" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Hydro</text>
  <text x="335" y="197" fill="#6366f1" font-family="sans-serif" font-size="12" font-weight="bold">39%</text>

  <rect x="430" y="245" width="55" height="45" fill="#f59e0b" rx="3"/>
  <text x="430" y="315" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold">Biomass</text>
  <text x="445" y="237" fill="#d97706" font-family="sans-serif" font-size="12" font-weight="bold">21%</text>
</svg>

